# Las pruebas usan una base de datos en memoria (H2 en modo MySQL)
# para no depender de que MySQL esté encendido.
spring.datasource.url=jdbc:h2:mem:bibliocontrol;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
