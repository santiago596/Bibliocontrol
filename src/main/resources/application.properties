spring.application.name=bibliocontrol
server.port=8080

# ---------- Persistencia: MySQL (XAMPP) ----------
# La base de datos "bibliocontrol" se crea automáticamente si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/bibliocontrol?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=

# Hibernate crea/actualiza las tablas a partir de las entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
